name: Release

# Pushing a tag vX.Y.Z builds that version and publishes it as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # The tests ran on this commit in CI; a release only has to compile and lint cleanly.
      - run: bun run typecheck && bun run lint
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the desktop app
        run: cd apps/desktop && bun run build
      - name: Build, sum and sign the release
        env:
          WARREN_RELEASE_SIGNING_KEY: ${{ secrets.WARREN_RELEASE_SIGNING_KEY }}
        run: >
          bun scripts/release.ts --require-signature
          --desktop apps/desktop/src-tauri/target/release/bundle/macos/Warren.app
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/release/*
          generate_release_notes: true
